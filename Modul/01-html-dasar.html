<!-- 
    Ini adalah komentar HTML. Komentar ini tidak akan muncul di website, 
    hanya bisa dibaca oleh programmer. Gunakan ini untuk catatan! 
-->

<!-- DOCTYPE memberitahu browser bahwa kita menggunakan HTML5 terbaru -->
<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Tag <head> menyimpan informasi di balik layar (tidak tampil di halaman web utama) -->
    <meta charset="UTF-8">
    
    <!-- Tag viewport ini WAJIB ada agar website tidak hancur saat dibuka di HP (Responsive) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Judul yang muncul di Tab browser (di atas) -->
    <title>Belajar HTML Dasar</title>
</head>
<body>
    <!-- Tag <body> adalah area kanvas tempat semua elemen web ditampilkan -->

    <!-- H1 - H6 adalah Heading (Judul). H1 paling besar, H6 paling kecil. -->
    <h1>Ini adalah Judul Utama (H1)</h1>
    <h2>Ini adalah Sub Judul (H2)</h2>

    <!-- Tag <p> digunakan untuk membuat paragraf biasa -->
    <p>Ini adalah paragraf. HTML singkatan dari HyperText Markup Language, yang berfungsi sebagai kerangka sebuah website.</p>

    <!-- Tag <a> (Anchor) digunakan untuk membuat Link yang bisa di-klik -->
    <!-- href = tujuan link tersebut (alamat web) -->
    <a href="https://google.com">Ini tombol link ke Google</a>

    <br><br> <!-- Tag <br> untuk Enter / Ganti baris -->

    <!-- Tag <img> digunakan untuk memanggil gambar -->
    <!-- src = sumber letak gambar (bisa link internet atau file lokal) -->
    <!-- alt = teks alternatif jika gambar gagal dimuat (penting untuk tunanetra) -->
    <img src="https://via.placeholder.com/150" alt="Gambar Contoh">

    <hr> <!-- Tag <hr> untuk membuat garis horizontal -->

    <!-- 
        =========================================================
        TAG PEMBUNGKUS (SANGAT PENTING!) 
        =========================================================
    -->
    
    <!-- <div> (Division) ibarat sebuah "Kardus". 
         Kita menaruh teks, gambar, dll ke dalam div agar mudah diatur desainnya nanti. -->
    <div id="kotak-profil">
        <h3>Profil Saya</h3>
        <!-- <span> adalah pembungkus sebaris, beda dengan div yang makan 1 blok panjang -->
        <p>Nama: <span style="font-weight: bold;">Budi</span></p> 
    </div>

    <!-- Selain <div>, ada tag pembungkus spesifik agar rapi (Semantic HTML):
         - <nav> : khusus untuk membungkus Menu Navigasi
         - <section> : khusus untuk bagian-bagian konten
         - <footer> : khusus untuk bagian paling bawah web 
    -->

</body>
</html>
